spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://inkan.apps.127-0-0-1.nip.io
          jwk-set-uri: http://inkan.apps.internal:8080/oauth2/jwks

sekisho:
  inventory-refresh-interval: 15m
  backends:
    - prefix: juice
      name: JUICE Ollama
      type: OLLAMA
      base-url: http://100.117.170.53:11434
      health-url: http://100.117.170.53:11434/api/tags
    - prefix: traveler
      name: TRAVELER Ollama
      type: OLLAMA
      base-url: http://100.116.191.85:11434
      health-url: http://100.116.191.85:11434/api/tags
    - prefix: kintsugi
      name: KINTSUGI vLLM
      type: VLLM
      base-url: http://100.105.149.44:8000/v1
      health-url: http://100.105.149.44:8000/v1/models
      # vLLM's OpenAI-compatible listing carries no capabilities field, so the node declares what its
      # models support. DeepSeek-V4-Flash and Qwen3-Coder are both reasoning and tool-calling models.
      capabilities: [completion, tools, reasoning]
    - prefix: spark
      name: SPARK vLLM
      type: VLLM
      base-url: http://100.91.161.110:8000/v1
      health-url: http://100.91.161.110:8000/v1/models
      # DeepSeek-V4-Flash is a reasoning model and supports tool calling; declared, not discoverable.
      capabilities: [completion, tools, reasoning]
    - prefix: gemini
      name: Google Gemini
      type: GEMINI
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      api-key: ${GEMINI_API_KEY:unset}
    - prefix: cloud
      name: Anthropic
      type: ANTHROPIC
      base-url: https://api.anthropic.com/v1
      api-key: ${ANTHROPIC_API_KEY:unset}
    - prefix: openai
      name: OpenAI
      type: OPENAI
      base-url: https://api.openai.com/v1
      api-key: ${OPENAI_API_KEY:unset}

management:
  opentelemetry:
    resource-attributes:
      service.name: sekisho
      service.namespace: dashaun-ai
