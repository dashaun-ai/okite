inkan:
  issuer: https://inkan.dashaun.ai
  web-client:
    redirect-uris:
      - https://kansei.dashaun.ai/login/oauth2/code/inkan
      - http://kansei.apps.internal:8080/login/oauth2/code/inkan
      - https://karakuri.dashaun.ai/login/oauth2/code/inkan
      - http://karakuri.apps.internal:8080/login/oauth2/code/inkan
    post-logout-redirect-uris:
      - https://kansei.dashaun.ai/
      - http://kansei.apps.internal:8080/
      - https://karakuri.dashaun.ai/
      - http://karakuri.apps.internal:8080/

management:
  opentelemetry:
    resource-attributes:
      service.name: inkan
      service.namespace: dashaun-ai
